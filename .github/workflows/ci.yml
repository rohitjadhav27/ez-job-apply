name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      # No database secret is wired in on purpose: DB tests skip without TEST_DATABASE_URL.
      - run: uv sync --frozen --all-extras --dev
      - run: uv run pytest -q
